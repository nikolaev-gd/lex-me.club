<!doctype html>
<!-- lang="en": every visible string on this page and in the iPhone app is
     English. The extension stays Russian — it is a different audience and a
     different surface, and it is not touched by this. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area insets in the stylesheet are what keep
     the composer clear of the iPhone home indicator once this page is inside a
     WKWebView. maximum-scale is NOT set: pinch-zoom is an accessibility
     feature, and the real fix for the iOS auto-zoom is a 16px input font. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lex</title>
<link rel="stylesheet" href="wc-app.css?v=1787322164">
<script>window.WC_VERSION = "web-1787322164";window.WC_BUILD = {"version":"1.160.3","commit":"6a60592","stamp":"1787322164"};</script>
</head>
<body>

<!-- ── Первая загрузка ────────────────────────────────────────────────────
     Показан СРАЗУ, разметкой, без единой строчки скрипта: и форма входа, и
     приложение стартуют скрытыми, и пока решается «вошёл или нет», экран был
     белым. Белый экран неотличим от сломанного приложения. -->
<div class="wc-boot" id="wc-boot">
  <div class="wc-boot-brand">Lex</div>
  <div class="wc-boot-rows">
    <div class="wc-boot-row"></div>
    <div class="wc-boot-row"></div>
    <div class="wc-boot-row"></div>
    <div class="wc-boot-row"></div>
    <div class="wc-boot-row"></div>
  </div>
  <div class="wc-boot-bar"></div>
</div>

<!-- ── Gate ──────────────────────────────────────────────────────────────── -->
<!-- A plain form on our own page. The extension wraps the same form in a
     nested chrome-extension:// iframe because it renders over an arbitrary
     site; here there is nobody to isolate the password from. -->
<div class="wc-gate" id="wc-gate" hidden>
  <div class="wc-gate-card">
    <div class="wc-gate-brand">Lex</div>
    <p class="wc-gate-sub">Your English teacher</p>
    <form id="wc-gate-form" novalidate>
      <input id="wc-email" type="email" autocomplete="email" placeholder="Email" spellcheck="false">
      <input id="wc-password" type="password" autocomplete="current-password" placeholder="Password">
      <button type="submit" class="wc-btn wc-btn-primary" id="wc-signin">Sign in</button>
    </form>
    <button class="wc-btn wc-btn-ghost" id="wc-signup">Create account</button>
    <div class="wc-gate-or"><span>or</span></div>
    <button class="wc-btn wc-btn-ghost" id="wc-google">Continue with Google</button>
    <div class="wc-gate-status" id="wc-gate-status" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div class="wc-root" id="wc-root" hidden>

  <!-- Scrim: on a narrow screen the sidebar slides over the thread and this
       catches the tap that closes it. Inert on wide screens. -->
  <div class="wc-scrim" id="wc-scrim" hidden></div>

  <aside class="wc-sidebar" id="wc-sidebar" aria-label="Chats">
    <div class="wc-sidebar-head">
      <button class="wc-icon-btn wc-burger" id="wc-sidebar-close" title="Close" aria-label="Close chats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h9"/></svg>
      </button>
      <div class="wc-sidebar-title">Chats</div>
    </div>
    <div class="wc-convs" id="wc-convs" role="list"></div>
    <!-- Низ шторки — ДВЕ кнопки, зрительно разделённые (решение владельца
         2026-08-20): слева настройки, уже, справа пополнение с суммой на
         кнопке, шире. Ширины 1:2, и это не «поровну» нарочно — пополнение
         здесь главное действие, настройки открываются изредка.
         Аккаунт, оформление и выход никуда не переехали: они внутри листа
         настроек, который открывает левая кнопка. Кнопка пополнения из того
         листа при этом УБРАНА — вход в пополнение остаётся ровно один.
         Кружка с буквой больше нет: он открывал тот же лист, что и подпись
         рядом, то есть был третьим органом на два действия.
         Почты здесь нет: решение владельца от 2026-08-17. -->
    <div class="wc-account">
      <button class="wc-account-settings" id="wc-account-settings" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.08 4.34 L11.01 2.45 L12.99 2.45 L13.92 4.34 L16.06 5.22 L18.05 4.55 L19.45 5.95 L18.78 7.94 L19.66 10.08 L21.55 11.01 L21.55 12.99 L19.66 13.92 L18.78 16.06 L19.45 18.05 L18.05 19.45 L16.06 18.78 L13.92 19.66 L12.99 21.55 L11.01 21.55 L10.08 19.66 L7.94 18.78 L5.95 19.45 L4.55 18.05 L5.22 16.06 L4.34 13.92 L2.45 12.99 L2.45 11.01 L4.34 10.08 L5.22 7.94 L4.55 5.95 L5.95 4.55 L7.94 5.22 Z"/><circle cx="12" cy="12" r="3.1"/></svg>
        <span>Settings</span>
      </button>
      <button class="wc-account-topup" id="wc-account-topup" type="button">
        <span>Top up balance</span>
        <span class="wc-account-balance" id="wc-account-balance">—</span>
      </button>
    </div>
  </aside>

  <main class="wc-main">
    <!-- Ровно два органа при обычном чтении/наборе — новый чат, либо, во
         время звонка, шестерёнка на его месте (решение владельца
         2026-08-17, дополнено 2026-08-19 для звонка). Название беседы отсюда
         убрано: оно осталось в заголовке вкладки и окна оболочки, где не
         занимает места на экране телефона. -->
    <header class="wc-topbar">
      <!-- Три полоски, последняя короткая — форма из приложения Anthropic.
           Открывает шторку истории СЛЕВА. -->
      <button class="wc-icon-btn wc-burger" id="wc-sidebar-open" title="Chats" aria-label="Chats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h9"/></svg>
      </button>
      <div class="wc-topbar-right">
        <!-- Появляется ТОЛЬКО когда в текущем чате что-то есть — «новый чат»
             поверх и без того пустого чата — кнопка, которой нечего делать —
             и гаснет на время звонка (тогда её место занимает шестерёнка
             ниже). Оба условия считает и решает hidden сам wc-header.js
             (paintTopbarRight, из setHasContent + setVoiceActive). -->
        <button class="wc-icon-btn wc-new-chat" id="wc-new-chat" title="New chat" aria-label="New chat" hidden>
          <!-- Ровно те же два пути, что рисует расширение (chat-surface.js,
               newChatBtn в buildHeader): карандаш НАД листом, а не карандаш с
               подчёркиванием. Скопировано, а не подобрано похожее. Толщину
               линии задаёт CSS (.wc-new-chat svg), потому что атрибут
               stroke-width на элементе проигрывает базовому правилу svg{}
               этой страницы — от разметки расширения он бы просто отвалился. -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        </button>
        <!-- Только во время звонка — открывает переключатель Live
             conversation / Push to talk, тот же самый, что и долгое нажатие
             на круглую кнопку разговора в композере
             (WcComposer.openVoiceModeMenu, wc-composer.js). Своего меню не
             заводит. Видимость — wc-header.js, см. новый чат выше. -->
        <button class="wc-icon-btn wc-voice-gear" id="wc-voice-gear" title="Live conversation or push to talk" aria-label="Live conversation or push to talk" aria-haspopup="menu" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.08 4.34 L11.01 2.45 L12.99 2.45 L13.92 4.34 L16.06 5.22 L18.05 4.55 L19.45 5.95 L18.78 7.94 L19.66 10.08 L21.55 11.01 L21.55 12.99 L19.66 13.92 L18.78 16.06 L19.45 18.05 L18.05 19.45 L16.06 18.78 L13.92 19.66 L12.99 21.55 L11.01 21.55 L10.08 19.66 L7.94 18.78 L5.95 19.45 L4.55 18.05 L5.22 16.06 L4.34 13.92 L2.45 12.99 L2.45 11.01 L4.34 10.08 L5.22 7.94 L4.55 5.95 L5.95 4.55 L7.94 5.22 Z"/><circle cx="12" cy="12" r="3.1"/></svg>
        </button>
      </div>
    </header>

    <div class="wc-thread" id="wc-thread" tabindex="-1">
      <div class="wc-empty" id="wc-empty">
        <!-- Same file as icons/icon128-gold.png (the toolbar/menu-bar mark,

    <div class="wc-composer-wrap">
      <button class="wc-jump" id="wc-jump" hidden title="Jump to latest" aria-label="Jump to latest">

      </button>
      <!-- Привязанная страница или видео. Отдельная строка НАД коробкой
           композера — так же, как в расширении (page-context.js ставит свою
           полоску первым ребёнком .ytvocab-chat-input-row).
           ТОЛЬКО НА ЧТЕНИЕ: открепить нельзя (это правило влито в main,
           v1.148.2 — «привязка запечатана, как только беседа заговорила»), и
           прикрепить с телефона тоже нельзя — чужую вкладку он не читает.
           Нажатие открывает оригинал. -->
      <a class="wc-pagebar" id="wc-pagebar" hidden target="_blank" rel="noopener noreferrer">
        <span class="wc-pagebar-icon" aria-hidden="true"></span>
        <span class="wc-pagebar-label" id="wc-pagebar-label"></span>
      </a>
      <div class="wc-attachments" id="wc-attachments" hidden></div>
      <!-- Композер повторяет устройство расширения: ОДНА скруглённая коробка,
           внутри поле, под ним ряд органов. Слева плюс и чип режима, справа
           микрофон и одна кнопка на два состояния. -->
      <form class="wc-composer" id="wc-composer">
        <input type="file" id="wc-file" accept="image/*" multiple hidden>
        <textarea id="wc-input" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>

        <div class="wc-composer-actions">
          <div class="wc-composer-left">
            <button type="button" class="wc-icon-btn wc-composer-btn" id="wc-plus" title="Add" aria-label="Add" aria-haspopup="menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <!-- Чип режима. Это ОТПРАВКА, а не переключатель: нажал — реплика
                 ушла в режиме «Носитель», со своим промптом и своей моделью.
                 Меню выбора режимов не рисуется — режим один, выбирать не из
                 чего. Долгое удержание заложено точкой расширения и сегодня
                 молчит. -->
            <button type="button" class="wc-mode-pill" id="wc-native" title="Send as Native" aria-label="Send as Native">
              <span class="wc-mode-pill-label">Native</span>
              <svg viewBox="0 0 24 24" aria-hidden="true" class="wc-mode-pill-arrow"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>

          <div class="wc-composer-right">
            <button type="button" class="wc-icon-btn wc-composer-btn" id="wc-mic" title="Dictate" aria-label="Dictate">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
            </button>
            <!-- Живой разговор и отправка занимают ОДНО место и перетекают друг
                 в друга. Не две кнопки, которые прячутся по очереди: подмена
                 рывком под большим пальцем — это и есть «выглядит как сайт». -->
            <div class="wc-send-slot">
              <button type="button" class="wc-round wc-voice-btn" id="wc-talk" title="Live conversation" aria-label="Live conversation">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/></svg>
              </button>
              <button type="submit" class="wc-round wc-send" id="wc-send" title="Send" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
      </form>
      <!-- Звонок докладывается СЮДА, а не отдельным полноэкранным листом
           поверх всего (это решение владельца было исполнено раньше — см.
           wc-voice-screen.js — и заменено 2026-08-19 явным заданием: во
           время звонка это тот же самый экран чата, только вместо поля
           ввода — микрофон и трубка). Тот же .wc-composer-wrap, что и у
           обычного композера, значит те же отступы и то же измерение
           высоты (--wc-composer-h, wc-app.js watchBarHeights) — ничего не
           прыгает при переключении. Содержимое строит WcVoiceScreen.open();
           показ/скрытие — тем же атрибутом hidden, что и раньше, и тем же
           классом .is-voice на #wc-root, который прячет форму композера
           (wc-app.css). Не диалог: это не модальное окно поверх страницы,
           а замена одной строки управления на другую внутри той же строки
           экрана — лента над ним остаётся полностью читаемой и живой. -->
      <div class="wc-voice" id="wc-voice" hidden></div>
      <div class="wc-composer-note" id="wc-composer-note"></div>
    </div>
  </main>
</div>
